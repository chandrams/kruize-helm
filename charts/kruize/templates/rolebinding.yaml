{{- $fullName := include "kruize.fullname" . -}}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $fullName }}-recommendation-updater-crb-{{ .Release.Namespace }}
  labels:
    {{- include "kruize.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kruize.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}-recommendation-updater-{{ .Release.Namespace }}
---
{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-monitoring-view-{{ .Release.Namespace }}
  labels:
    {{- include "kruize.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kruize.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-monitoring-view
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-instaslices-access-binding-{{ .Release.Namespace }}
  labels:
    {{- include "kruize.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kruize.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $fullName }}-instaslices-access-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-edit-ko-binding-{{ .Release.Namespace }}
  labels:
    {{- include "kruize.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kruize.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $fullName }}-edit-ko-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
---
{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-autotune-scc-crb-{{ .Release.Namespace }}
  labels:
    {{- include "kruize.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ include "kruize.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
