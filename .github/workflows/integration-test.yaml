name: Kruize Helm Chart Integration Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'charts/kruize/**'
      - '.github/workflows/integration-test.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'charts/kruize/**'
      - '.github/workflows/integration-test.yaml'
  workflow_dispatch:
    inputs:
      cluster_type:
        description: 'Cluster type to test on'
        required: false
        default: 'kind'
        type: choice
        options:
          - kind
          - minikube

env:
  HELM_VERSION: v3.13.0
  KUBECTL_VERSION: v1.28.0
  KIND_VERSION: v0.20.0
  MINIKUBE_VERSION: v1.32.0

jobs:
  integration-test-kind:
    name: Integration Test on Kind
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.cluster_type == 'kind'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Create Kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          version: ${{ env.KIND_VERSION }}
          cluster_name: kruize-test
          wait: 120s
          config: |
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
            - role: control-plane
              extraPortMappings:
              - containerPort: 30080
                hostPort: 30080
                protocol: TCP
              - containerPort: 30081
                hostPort: 30081
                protocol: TCP

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -A

      - name: Run integration tests
        run: |
          cd charts/kruize/tests/integration
          chmod +x deploy-test.sh validate-deployment.sh cleanup.sh
          ./deploy-test.sh \
            -v values-integration-test.yaml \
            -n kruize-integration-test \
            -r kruize-ci-test \
            -t 10m

      - name: Display test results
        if: always()
        run: |
          echo "=== Deployment Status ==="
          kubectl get all -n kruize-integration-test || true
          echo ""
          echo "=== Pod Logs ==="
          kubectl logs -n kruize-integration-test -l app.kubernetes.io/instance=kruize-ci-test --tail=50 || true
          echo ""
          echo "=== Events ==="
          kubectl get events -n kruize-integration-test --sort-by='.lastTimestamp' || true

      - name: Cleanup
        if: always()
        run: |
          cd charts/kruize/tests/integration
          ./cleanup.sh -n kruize-integration-test -r kruize-ci-test --all -f

  integration-test-minikube:
    name: Integration Test on Minikube
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.cluster_type == 'minikube'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          minikube-version: ${{ env.MINIKUBE_VERSION }}
          driver: docker
          cpus: 2
          memory: 4096
          kubernetes-version: v1.28.0

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -A
          minikube addons list

      - name: Enable Minikube addons
        run: |
          minikube addons enable storage-provisioner
          minikube addons enable default-storageclass
          kubectl get storageclass

      - name: Run integration tests
        run: |
          cd charts/kruize/tests/integration
          chmod +x deploy-test.sh validate-deployment.sh cleanup.sh
          ./deploy-test.sh \
            -v values-minikube-integration-test.yaml \
            -n kruize-integration-test \
            -r kruize-ci-test \
            -t 10m

      - name: Display test results
        if: always()
        run: |
          echo "=== Deployment Status ==="
          kubectl get all -n kruize-integration-test || true
          echo ""
          echo "=== Pod Logs ==="
          kubectl logs -n kruize-integration-test -l app.kubernetes.io/instance=kruize-ci-test --tail=50 || true
          echo ""
          echo "=== Events ==="
          kubectl get events -n kruize-integration-test --sort-by='.lastTimestamp' || true
          echo ""
          echo "=== Service URLs ==="
          minikube service list -n kruize-integration-test || true

      - name: Cleanup
        if: always()
        run: |
          cd charts/kruize/tests/integration
          ./cleanup.sh -n kruize-integration-test -r kruize-ci-test --all -f

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint Helm chart
        run: |
          helm lint charts/kruize
          helm lint charts/kruize -f charts/kruize/values-minikube.yaml

  helm-template:
    name: Helm Template Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Template Helm chart
        run: |
          helm template kruize-test charts/kruize > /tmp/kruize-default.yaml
          helm template kruize-test charts/kruize -f charts/kruize/values-minikube.yaml > /tmp/kruize-minikube.yaml
          
          echo "=== Default Template ==="
          cat /tmp/kruize-default.yaml
          echo ""
          echo "=== Minikube Template ==="
          cat /tmp/kruize-minikube.yaml

      - name: Validate YAML
        run: |
          # Check if templates are valid YAML
          kubectl apply --dry-run=client -f /tmp/kruize-default.yaml
          kubectl apply --dry-run=client -f /tmp/kruize-minikube.yaml

  unit-tests:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Run unit tests
        run: |
          helm unittest charts/kruize

      - name: Generate test report
        if: always()
        run: |
          helm unittest --output-type JUnit --output-file test-results.xml charts/kruize

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: helm-unittest-results
          path: test-results.xml

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [integration-test-kind, helm-lint, helm-template, unit-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "=== Test Summary ==="
          echo "Integration Test (Kind): ${{ needs.integration-test-kind.result }}"
          echo "Helm Lint: ${{ needs.helm-lint.result }}"
          echo "Helm Template: ${{ needs.helm-template.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          
          if [[ "${{ needs.integration-test-kind.result }}" == "failure" ]] || \
             [[ "${{ needs.helm-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.helm-template.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests.result }}" == "failure" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi

